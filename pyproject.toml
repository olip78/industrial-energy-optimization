[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-optimization"
version = "0.1.0"
description = "Forecasting, MPC and stochastic optimization for industrial energy management"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2.2",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<4",
  "pyarrow>=16,<26",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
train = [
  "catboost>=1.2,<2",
  "mlflow>=3,<4",
  "pvlib>=0.11,<1",
]
neural = [
  "torch>=2.4,<3",
]

[project.scripts]
energy = "energy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
